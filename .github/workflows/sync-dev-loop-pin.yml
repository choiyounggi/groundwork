# Keep the dev-loop marketplace pin on dev-loop's latest release.
#
# dev-loop ships as a TAG-PINNED url source, so a dev-loop release reaches no
# installed user until this repo's `source.ref` + `version` move. That step was
# hand-done and got skipped (dev-loop v1.11.0 sat unreachable while `/plugin`
# reported 1.10.0 as latest), so it runs on a schedule here instead.
#
# The bump is committed straight to main: it is two machine-generated lines that
# are fully regenerable from the release tag, and a PR would gain nothing — a
# GITHUB_TOKEN PR does not trigger CI, so there would be no checks on it to
# review. This job instead runs the checks CI would run (bats + version sync +
# an idempotency re-run) BEFORE pushing, and pushes only if they pass.
#
# Run it immediately after a dev-loop release with:
#   gh workflow run sync-dev-loop-pin.yml --repo choiyounggi/groundwork
#
# After it lands, an install picks the new version up with
# `claude plugin marketplace update groundwork` + `claude plugin update
# dev-loop@groundwork` (the local SessionStart hook does this daily).

name: sync dev-loop pin

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset off the hour
  workflow_dispatch:

permissions:
  contents: write # commits the pin bump to main; no PR is opened

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Resolve dev-loop's latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/choiyounggi/dev-loop/releases/latest --jq .tag_name)
          echo "dev-loop latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Move the pin
        id: sync
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set +e
          out=$(bash scripts/sync-dev-loop-pin.sh "$TAG")
          rc=$?
          set -e
          echo "$out"
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sync-dev-loop-pin.sh failed (exit $rc): $out"; exit 1 ;;
          esac

      # Nothing downstream will check this commit — a GITHUB_TOKEN push does not
      # trigger workflows — so the checks that would have run on a PR run here,
      # before anything reaches main.
      - name: Verify the rewritten marketplace file
        if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          bats tests
          bash scripts/check-versions.sh
          # Idempotency: a second run against the same tag must be a clean no-op.
          bash scripts/sync-dev-loop-pin.sh "$TAG"

      - name: Commit the pin to main
        if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q \
            -m "feat(marketplace): bump dev-loop pin to release tag ${TAG}" \
            -m "dev-loop's entry is tag-pinned, so ${TAG} does not reach installs until this pin moves. Committed automatically by .github/workflows/sync-dev-loop-pin.yml." \
            -a
          # main may have moved since checkout (this runs hourly, and a human may
          # be merging at the same moment) — rebase once and retry rather than
          # leaving the release stranded until the next hour.
          if ! git push -q origin HEAD:main; then
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
          echo "pinned dev-loop at ${TAG} on main"
