# Keep the dev-loop marketplace pin on dev-loop's latest release.
#
# dev-loop ships as a TAG-PINNED url source, so a dev-loop release reaches no
# installed user until this repo's `source.ref` + `version` move. That step was
# hand-done and got skipped (dev-loop v1.11.0 sat unreachable while `/plugin`
# reported 1.10.0 as latest), so it runs on a schedule here instead.
#
# main is protected by a ruleset (id 21371046) that forbids direct pushes for
# everyone — no bypass actor, because a personal-account repo cannot grant one to
# the GitHub Actions app. So this job goes through the same door a human does: it
# pushes a branch, opens a PR and merges it. A GITHUB_TOKEN PR does not trigger
# CI, so the checks that would have run on it (bats + version sync + an
# idempotency re-run) run in this job first, and it merges only if they pass.
#
# Run it immediately after a dev-loop release with:
#   gh workflow run sync-dev-loop-pin.yml --repo choiyounggi/groundwork
#
# After it lands, an install picks the new version up with
# `claude plugin marketplace update groundwork` + `claude plugin update
# dev-loop@groundwork` (the local SessionStart hook does this daily).

name: sync dev-loop pin

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset off the hour
  workflow_dispatch:

permissions:
  contents: write # pushes the bump branch
  pull-requests: write # opens and merges its own PR (main forbids direct pushes)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Resolve dev-loop's latest release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/choiyounggi/dev-loop/releases/latest --jq .tag_name)
          echo "dev-loop latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Move the pin
        id: sync
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set +e
          out=$(bash scripts/sync-dev-loop-pin.sh "$TAG")
          rc=$?
          set -e
          echo "$out"
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sync-dev-loop-pin.sh failed (exit $rc): $out"; exit 1 ;;
          esac

      # Nothing downstream will check this commit — a GITHUB_TOKEN push does not
      # trigger workflows — so the checks that would have run on a PR run here,
      # before anything reaches main.
      - name: Verify the rewritten marketplace file
        if: steps.sync.outputs.changed == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          bats tests
          bash scripts/check-versions.sh
          # Idempotency: a second run against the same tag must be a clean no-op.
          bash scripts/sync-dev-loop-pin.sh "$TAG"

      - name: Open and merge the pin bump
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          branch="chore/pin-dev-loop-${TAG}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -q \
            -m "feat(marketplace): bump dev-loop pin to release tag ${TAG}" \
            -m "dev-loop's entry is tag-pinned, so ${TAG} does not reach installs until this pin moves. Opened and merged automatically by .github/workflows/sync-dev-loop-pin.yml." \
            -a
          # The branch carries nothing but the regenerated two-line pin edit, so a
          # stale one left by a failed run is overwritten rather than blocking.
          git push -q --force origin "$branch"

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[].number' | head -1)
          if [ -z "$pr" ]; then
            # Every body line is its own printf so no line in this YAML block
            # scalar starts at column 0 — a column-0 continuation ends the block,
            # and GitHub then registers the workflow with NO triggers.
            {
              printf '%s\n\n' "dev-loop released [\`${TAG}\`](https://github.com/choiyounggi/dev-loop/releases/tag/${TAG}); this repo's entry is tag-pinned, so installs stay on the old version until \`source.ref\` and \`version\` move."
              printf '%s\n\n' "Opened and merged automatically by \`.github/workflows/sync-dev-loop-pin.yml\`."
              printf '%s\n\n' "**Checks already run in the workflow** (a GITHUB_TOKEN PR does not trigger CI): \`bats tests\`, \`scripts/check-versions.sh\`, and an idempotency re-run of the sync script — all green."
              printf '%s\n' "Installs pick it up on the next \`claude plugin marketplace update groundwork\` + \`claude plugin update dev-loop@groundwork\` (the local SessionStart hook runs this daily)."
            } > "$RUNNER_TEMP/pr-body.md"
            gh pr create \
              --title "feat(marketplace): bump dev-loop pin to release tag ${TAG}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --head "$branch" --base main
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[].number' | head -1)
          fi

          gh pr merge "$pr" --squash --delete-branch
          echo "pinned dev-loop at ${TAG} on main via PR #${pr}"
