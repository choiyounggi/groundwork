name: test

on:
  push:
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run guardrails tests
        run: bats plugins/guardrails/tests

      - name: Run memory-loop tests
        run: bats plugins/memory-loop/tests

  shellcheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint hooks
        run: shellcheck -s bash plugins/*/hooks/*.sh

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run check-versions tests
        run: bats tests

      - name: Check marketplace/plugin.json version sync
        run: bash scripts/check-versions.sh
