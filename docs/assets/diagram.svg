<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="560" fill="#0b1220"/>

  <!-- Claude Code -->
  <rect x="450" y="34" width="300" height="62" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#e2e8f0">Claude Code / AI agent</text>

  <!-- arrow -->
  <line x1="600" y1="96" x2="600" y2="150" stroke="#22c55e" stroke-width="3"/>
  <polygon points="600,160 591,146 609,146" fill="#22c55e"/>

  <!-- container -->
  <rect x="56" y="170" width="1088" height="356" rx="22" fill="#0f172a" stroke="#22c55e" stroke-width="3"/>
  <text x="88" y="212" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#22c55e">groundwork</text>
  <text x="320" y="212" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#64748b">safe-by-default harness · 4 plugins, installable individually</text>

  <!-- card 1: guardrails -->
  <rect x="88" y="248" width="246" height="252" rx="14" fill="#111c34" stroke="#1e293b" stroke-width="2"/>
  <text x="110" y="294" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">guardrails</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">
    <text x="110" y="334">blocks / asks on rm -rf,</text>
    <text x="110" y="360">force-push, DROP,</text>
    <text x="110" y="386">kubectl delete, secret</text>
    <text x="110" y="412">reads, curl | sh</text>
    <text x="110" y="470" fill="#22c55e">+ redacted audit log</text>
  </g>

  <!-- card 2: dev-loop -->
  <rect x="352" y="248" width="246" height="252" rx="14" fill="#111c34" stroke="#1e293b" stroke-width="2"/>
  <text x="374" y="294" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">dev-loop</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">
    <text x="374" y="334">wiki-grounded loop</text>
    <text x="374" y="360">plan → TDD → verify</text>
    <text x="374" y="386">+ multi-session</text>
    <text x="374" y="412">orchestrator</text>
    <text x="374" y="470" fill="#22c55e">Orca-native · tmux fallback</text>
  </g>

  <!-- card 3: memory-loop -->
  <rect x="616" y="248" width="246" height="252" rx="14" fill="#111c34" stroke="#1e293b" stroke-width="2"/>
  <text x="638" y="294" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">memory-loop</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">
    <text x="638" y="334">save-gate vs hallucinated</text>
    <text x="638" y="360">memory, tiered expiry,</text>
    <text x="638" y="386">HABITS.md (budgeted)</text>
    <text x="638" y="412">OUTPUT.md (ELI5, lean)</text>
    <text x="638" y="470" fill="#22c55e">+ correction signal</text>
  </g>

  <!-- card 4: jev-gate -->
  <rect x="880" y="248" width="246" height="252" rx="14" fill="#111c34" stroke="#1e293b" stroke-width="2"/>
  <text x="902" y="294" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">jev-gate</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">
    <text x="902" y="334">local decision model</text>
    <text x="902" y="360">(Jev-style, typed answers)</text>
    <text x="902" y="386">Bash grey-zone gate,</text>
    <text x="902" y="412">Stop gate: no proof, no done</text>
    <text x="902" y="470" fill="#22c55e">0 tokens · ~0.75 s</text>
  </g>
</svg>
